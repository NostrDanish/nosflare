# Safe default: all ordinary deploy commands target the isolated staging Worker.
name = "nosflare-0xserverless-v8"
main = "worker.js"
compatibility_date = "2025-01-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "nosflare-0xserverless-v8-staging"
database_id = "8715866e-eabc-4257-a699-15db04497611"

# A fresh Durable Object namespace for the isolated staging Worker.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayWebSocket"]

[limits]
cpu_ms = 300000

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
