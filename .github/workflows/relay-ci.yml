name: Relay CI

on:
  push:
    branches:
      - v8-staging
      - "fix/**"
  pull_request:
    branches:
      - v8-staging

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build Worker bundle
        run: npm run build
