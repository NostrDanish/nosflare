name: Build staging Worker bundle

on:
  push:
    branches:
      - v8-staging

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run protocol unit tests
        run: npm test
      - name: Build Worker bundle
        run: npm run build
      - name: Commit generated bundle when it changes
        run: |
          if git diff --quiet -- worker.js; then
            echo "worker.js already matches source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "chore: rebuild staging Worker bundle [skip ci]"
          git push
