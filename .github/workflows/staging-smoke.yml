name: Staging relay smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - v8-staging
    paths:
      - "tests/staging-smoke.trigger"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test NIP-11 and WebSocket protocol
        run: npm run smoke:staging
        env:
          RELAY_URL: https://nosflare-0xserverless-v8.0xprivacy-online.workers.dev
